<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
</head>

<center><body>

    <h1>Contact Me</h1>
    
    <nav>
        <a href="http://my-site/Workshop1/index.html">Home</a> |
        <a href="http://my-site/Workshop1/pages/courses.html">Courses</a> |
        <a href="http://my-site/Workshop1/pages/schedule.html">Schedule</a> |
        <a href="http://my-site/Workshop1/pages/hobbies.html">Hobbies</a> |
        <a href="http://my-site/Workshop1/pages/contact.html">Contact</a>
    </nav>




    <p>
        Please complete the following form to get in touch with me.
    </p>

    <form>

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>

        <br><br>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required>

        <br><br>

        <label for="birthdate">Date of Birth:</label>
        <input type="date" id="birthdate" name="birthdate" required>

        <br><br>

        <label for="degree">Degree Program:</label>
        <select id="degree" name="degree" required>
            <option value="">Select your degree</option>
            <option value="computer-science">Computer Science</option>
            <option value="other">Other</option>
        </select>

        <br><br>

        <label for="semester">Semester:</label>
        <select id="semester" name="semester" required>
            <option value="">Select your semester</option>
            <option value="1">First Semester</option>
            <option value="2">Second Semester</option>
            <option value="3">Third Semester</option>
            <option value="4">Fourth Semester</option>
            <option value="5">Fifth Semester</option>
            <option value="6">Sixth Semester</option>
            <option value="7">Seventh Semester</option>
            <option value="8">Eighth Semester</option>
            <option value="9">Ninth Semester</option>
            <option value="10">Tenth Semester</option>
        </select>

        <br><br>

        <label for="reason">Reason for Contact:</label>
        <select id="reason" name="reason" required>
            <option value="">Select a reason</option>
            <option value="academic">Academic Question</option>
            <option value="project">Project Collaboration</option>
            <option value="feedback">Feedback</option>
            <option value="other">Other</option>
        </select>

        <br><br>

        <label for="message">Message:</label>
        <br>
        <textarea id="message" name="message" rows="6" cols="40" required></textarea>

        <br><br>

        <input type="checkbox" id="accept" name="accept" required>
        <label for="accept">
            I accept that my information can be used to respond to my message.
        </label>

        <br><br>

        <input type="submit" value="Submit">

    </form>

</center></body>

</html>
